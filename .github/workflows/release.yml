name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Verify tag matches package version
        run: |
          test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}" \
            || { echo "package.json version does not match tag ${GITHUB_REF_NAME}"; exit 1; }
      # Re-runnable: a version already on npm (published by hand) or a release
      # already created is skipped instead of failing the run.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')" version >/dev/null 2>&1; then
            echo "Already on npm; skipping publish."
          else
            npm publish
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes
